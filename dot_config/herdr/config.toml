onboarding = false
[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "$HOME/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt" 2>/dev/null || true', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = false
[ui.toast]
delivery = "system"

# BEGIN theme (managed by `theme`)
[theme]
name = "catppuccin"
auto_switch = false
dark_name = "catppuccin"
light_name = "catppuccin-latte"
# END theme

[experimental]
kitty_graphics = true

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block

